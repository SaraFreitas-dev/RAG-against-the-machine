
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAG study notes">
  <title>RAG — Documentation</title>

  <!-- Dark theme -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <!-- Code syntax colors -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/prism-themes@1/themes/prism-one-dark.min.css">

  <style>
    :root {
      --theme-color: #64b5f6;
      --content-max-width: 920px;
    }

    .markdown-section {
      line-height: 1.8;
    }

    .markdown-section pre {
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="app">Loading documentation...</div>

  <script>
    window.$docsify = {
      name: 'RAG against the machine',
      repo: '',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search documentation',
        noData: 'No results',
        depth: 4
      }
    };
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <!-- Search -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

  <!-- Python syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>

  <!-- Bash syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
